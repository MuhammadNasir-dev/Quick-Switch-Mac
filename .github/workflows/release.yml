name: Release

# Tag a commit to ship it:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# `workflow_dispatch` builds the same artefacts without tagging, which is the
# way to rehearse a release before committing to a version number.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.1)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

# Nothing is published from here: the workflow only builds. Read access is all
# it needs.
permissions:
  contents: read

env:
  PROJECT: window-manager.xcodeproj
  SCHEME: QuickSwitch
  APP_NAME: QuickSwitch
  # `nonisolated` on type declarations (SE-0449) is used throughout the
  # Accessibility and window layers, so anything older simply will not compile.
  MINIMUM_SWIFT: "6.1"

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: .github/scripts/select-xcode.sh

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
        # The enumerator tests query the live window server and self-skip when
        # Accessibility trust is absent, which it always is on a runner. The
        # rest of the suite needs no window server at all.

  build:
    name: Build ${{ matrix.label }}
    needs: test
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: apple-silicon
          - arch: x86_64
            label: intel
    steps:
      - uses: actions/checkout@v4

      - name: Select toolchain
        run: .github/scripts/select-xcode.sh

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (${{ matrix.arch }})"

      - name: Import Developer ID certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signing is optional so the workflow is useful before a Developer ID
          # certificate exists. Without one the app is ad-hoc signed: it runs
          # locally but Gatekeeper will refuse it on another Mac.
          if [ -z "$CERTIFICATE_P12" ] || [ -z "$TEAM_ID" ]; then
            echo "::warning::No Developer ID certificate configured — producing an ad-hoc signed, un-notarized build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Without this, codesign prompts for keychain access and hangs the job.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          ARCHIVE="$RUNNER_TEMP/$APP_NAME-${{ matrix.arch }}.xcarchive"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # `ARCHS` plus `ONLY_ACTIVE_ARCH=NO` is what makes this a
          # single-architecture build; Release would otherwise produce a
          # universal binary regardless of which runner it lands on.
          SIGNING_ARGS=(
            "CODE_SIGN_IDENTITY=-"
            "CODE_SIGN_STYLE=Manual"
            "CODE_SIGNING_REQUIRED=NO"
            "DEVELOPMENT_TEAM="
          )
          if [ "$SIGNED" = "true" ]; then
            SIGNING_ARGS=(
              "CODE_SIGN_IDENTITY=Developer ID Application"
              "CODE_SIGN_STYLE=Manual"
              "DEVELOPMENT_TEAM=$TEAM_ID"
              "OTHER_CODE_SIGN_FLAGS=--timestamp"
            )
          fi

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$ARCHIVE" \
            ARCHS="${{ matrix.arch }}" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${SIGNING_ARGS[@]}"

      - name: Verify the binary
        run: |
          APP="$ARCHIVE/Products/Applications/$APP_NAME.app"
          echo "APP=$APP" >> "$GITHUB_ENV"
          test -d "$APP" || { echo "::error::No app in the archive"; exit 1; }

          # The whole point of the matrix: prove the slice is what was asked for.
          ARCHS_BUILT="$(lipo -archs "$APP/Contents/MacOS/$APP_NAME")"
          echo "Architectures: $ARCHS_BUILT"
          if [ "$ARCHS_BUILT" != "${{ matrix.arch }}" ]; then
            echo "::error::Expected ${{ matrix.arch }}, got '$ARCHS_BUILT'"
            exit 1
          fi

          # A debug entitlement must never ship: it lets any process attach a
          # debugger, and notarization rejects it outright.
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q "get-task-allow"; then
            echo "::error::get-task-allow is present in a release build"
            exit 1
          fi

          codesign --verify --strict --verbose=2 "$APP"

      - name: Build the disk image
        id: package
        run: |
          set -euo pipefail
          NAME="$APP_NAME-${{ steps.version.outputs.version }}-${{ matrix.label }}"
          OUT="$RUNNER_TEMP/dist"
          mkdir -p "$OUT"

          # Stage the app beside a symlink to /Applications, which is what makes
          # the window a drag-and-drop install rather than a folder the user has
          # to work out what to do with.
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # `ditto` rather than `cp -R`: it preserves symlinks, resource forks
          # and the code signature. `cp` can silently produce a bundle that will
          # not launch.
          ditto "$APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"

          # UDZO is the compressed read-only format every Mac can open with no
          # third-party tooling.
          hdiutil create \
            -volname "$APP_NAME ${{ steps.version.outputs.version }}" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$OUT/$NAME.dmg"

          echo "dmg=$OUT/$NAME.dmg" >> "$GITHUB_OUTPUT"
          echo "name=$NAME.dmg" >> "$GITHUB_OUTPUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Notarize
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::Signed but not notarized — APPLE_ID / APPLE_APP_PASSWORD are unset. Gatekeeper will still refuse this build."
            exit 0
          fi

          # The disk image is submitted and stapled directly. Stapling the app
          # inside a DMG that was built earlier would leave the ticket on a copy
          # nobody ever mounts.
          xcrun notarytool submit "${{ steps.package.outputs.dmg }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "${{ steps.package.outputs.dmg }}"
          xcrun stapler validate "${{ steps.package.outputs.dmg }}"

      - name: Checksum
        run: |
          # After notarization: stapling rewrites the disk image, so a checksum
          # taken before it would not match what users download.
          cd "${{ steps.package.outputs.dir }}"
          shasum -a 256 "${{ steps.package.outputs.name }}" > "${{ steps.package.outputs.name }}.sha256"
          cat "${{ steps.package.outputs.name }}.sha256"

      - name: Verify the disk image opens
        run: |
          set -euo pipefail
          # Mount what users will actually double-click. A DMG that cannot be
          # attached, or that is missing the app, is worth catching here rather
          # than in a bug report.
          MOUNT="$(hdiutil attach "${{ steps.package.outputs.dmg }}" -nobrowse -readonly | tail -1 | awk '{ $1=""; $2=""; sub(/^  /, ""); print }')"
          echo "Mounted at: $MOUNT"
          test -d "$MOUNT/$APP_NAME.app" || { echo "::error::No app inside the disk image"; exit 1; }
          test -L "$MOUNT/Applications" || { echo "::error::No /Applications shortcut to drag onto"; exit 1; }
          codesign --verify --strict "$MOUNT/$APP_NAME.app"
          hdiutil detach "$MOUNT" -quiet

          # Informational: `spctl` rejects anything not notarized, which is
          # expected until the signing secrets are configured.
          spctl --assess --type exec --verbose=4 "$APP" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.package.outputs.dir }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Combine into one downloadable bundle
        run: |
          # A single artifact is one click to download, rather than one per
          # architecture, since these are uploaded to the public repository by
          # hand.
          ls -la dist
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          rm -f dist/*.dmg.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: QuickSwitch-${{ steps.version.outputs.version }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes to the job summary
        run: |
          # Paste-ready: the source repository is private and releases are
          # published manually to the public one, so the workflow prepares the
          # text rather than creating anything.
          {
            echo "## QuickSwitch ${{ steps.version.outputs.version }}"
            echo
            echo "Download the artifact above, then create the release at"
            echo "<https://github.com/MuhammadNasir-dev/QuickSwitch-Mac/releases/new>"
            echo "with the tag \`v${{ steps.version.outputs.version }}\` and the notes below."
            echo
            echo "---"
            echo
            echo "### Release notes"
            echo
            echo '```markdown'
            echo "Download the build that matches your Mac:"
            echo
            echo "| Mac | Download |"
            echo "| --- | --- |"
            echo "| Apple Silicon (M1 and later) | \`QuickSwitch-${{ steps.version.outputs.version }}-apple-silicon.dmg\` |"
            echo "| Intel | \`QuickSwitch-${{ steps.version.outputs.version }}-intel.dmg\` |"
            echo
            echo "Not sure? Apple menu -> About This Mac. \"Chip\" means Apple Silicon; \"Processor\" means Intel."
            echo
            echo "### Installing"
            echo
            echo "1. Open the .dmg and drag **QuickSwitch** onto the **Applications** shortcut."
            echo "2. The first launch is blocked because the app is not notarized:"
            echo "   open **System Settings -> Privacy & Security**, scroll down and click **Open Anyway**."
            echo "3. Launch it - there is no Dock icon, look for the menu bar."
            echo "4. Grant Accessibility access when prompted."
            echo
            echo "If no Open Anyway button appears, or macOS says the app is damaged,"
            echo "clear the quarantine flag instead - same effect as the button:"
            echo
            echo "    xattr -d com.apple.quarantine /Applications/QuickSwitch.app"
            echo '```'
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "---"
            echo
            echo "### Then update the website"
            echo
            echo "Replace \`appcast.json\` at the root of quickswitchmac.com with this."
            echo "Until you do, nobody running an older build is told an update exists."
            echo
            echo '```json'
            echo '{'
            echo '  "version": "${{ steps.version.outputs.version }}",'
            echo '  "url": "https://github.com/MuhammadNasir-dev/QuickSwitch-Mac/releases/latest"'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
